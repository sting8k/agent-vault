name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # attestation: sign
      attestations: write # attestation: store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            GOOS=${t%-*} GOARCH=${t#*-} go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/agv-$t" ./cmd/agv
          done
          cd dist
          for f in agv-*; do sha256sum "$f" > "$f.sha256"; done
          cat agv-*.sha256 > checksums.txt
      # Artifact attestations need a public repository (or GitHub Enterprise Cloud).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
